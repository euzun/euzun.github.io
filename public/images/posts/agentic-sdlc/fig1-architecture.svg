<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two-phase architecture: a planning front-end of human gates feeding an execution engine of sequential sub-plans.">
<style>
  .svg-title{font-family:'Inter','Optima','Gill Sans',sans-serif;font-weight:600;}
  .svg-label{font-family:'Inter','Optima','Gill Sans',sans-serif;}
  .svg-mono{font-family:'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,monospace;}
</style>

        <defs>
          <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
            <path d="M0,0 L8,4.5 L0,9 Z" fill="#7c2d2d"/>
          </marker>
          <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
            <path d="M0,0 L8,4.5 L0,9 Z" fill="#8a6d1f"/>
          </marker>
        </defs>

        <!-- Phase A panel -->
        <rect x="14" y="20" width="328" height="392" rx="14" fill="#f7f4ec" stroke="#e4e0d6"/>
        <text x="34" y="48" class="svg-title" font-size="15" fill="#7c2d2d" letter-spacing="1.5">PLANNING FRONT-END</text>
        <text x="34" y="66" class="svg-label" font-size="11.5" fill="#6b6b6b">cheap, human-gated, mostly conversation</text>

        <!-- gate nodes A -->
        <g class="svg-label" font-size="12.5" fill="#1a1a1a">
          <rect x="34" y="84" width="288" height="40" rx="8" fill="#fff" stroke="#cfcabb"/>
          <text x="48" y="101">① Intake interview</text>
          <text x="48" y="116" font-size="10.5" fill="#6b6b6b">project, stack, reference, ambition</text>

          <rect x="34" y="134" width="288" height="40" rx="8" fill="#fff" stroke="#cfcabb"/>
          <text x="48" y="151">② Archaeology pass</text>
          <text x="48" y="166" font-size="10.5" fill="#6b6b6b">read the old code → seed the spec + pointer map</text>

          <rect x="34" y="184" width="288" height="46" rx="8" fill="#fff" stroke="#cfcabb"/>
          <text x="48" y="201">③ Viability analysis</text>
          <text x="48" y="216" font-size="10.5" fill="#6b6b6b">literature · impact · cost → tiered advisory</text>
          <text x="290" y="201" font-size="15" fill="#7c2d2d">⚖</text>

          <rect x="34" y="240" width="288" height="46" rx="8" fill="#fff" stroke="#cfcabb"/>
          <text x="48" y="257">④ SPEC.md, point-by-point</text>
          <text x="48" y="272" font-size="10.5" fill="#6b6b6b">lock one decision before opening the next</text>
          <text x="290" y="257" font-size="14" fill="#8a6d1f">🔒</text>

          <rect x="34" y="296" width="288" height="40" rx="8" fill="#fff" stroke="#cfcabb"/>
          <text x="48" y="313">⑤ Permission manifest</text>
          <text x="48" y="328" font-size="10.5" fill="#6b6b6b">classify every action: auto / log / stop</text>

          <rect x="34" y="346" width="288" height="46" rx="8" fill="#fff" stroke="#cfcabb"/>
          <text x="48" y="363">⑥ Decomposition + “what’s missing?”</text>
          <text x="48" y="378" font-size="10.5" fill="#6b6b6b">mandatory + spec-derived sub-plans</text>
          <text x="290" y="363" font-size="14" fill="#7c2d2d">✋</text>
        </g>

        <!-- vertical flow arrows A -->
        <g stroke="#c9a23a" stroke-width="1.6" fill="none" opacity="0.9">
          <line x1="178" y1="124" x2="178" y2="132" marker-end="url(#arg)"/>
          <line x1="178" y1="174" x2="178" y2="182" marker-end="url(#arg)"/>
          <line x1="178" y1="230" x2="178" y2="238" marker-end="url(#arg)"/>
          <line x1="178" y1="286" x2="178" y2="294" marker-end="url(#arg)"/>
          <line x1="178" y1="336" x2="178" y2="344" marker-end="url(#arg)"/>
        </g>

        <!-- hand-off arrow -->
        <line x1="342" y1="216" x2="378" y2="216" stroke="#7c2d2d" stroke-width="2" marker-end="url(#ar)"/>
        <text x="346" y="208" class="svg-label" font-size="10" fill="#7c2d2d">hand-off</text>

        <!-- Phase B panel -->
        <rect x="378" y="20" width="328" height="392" rx="14" fill="#e8f1f5" stroke="#bcd6e1"/>
        <text x="398" y="48" class="svg-title" font-size="15" fill="#1f6f8b" letter-spacing="1.5">EXECUTION ENGINE</text>
        <text x="398" y="66" class="svg-label" font-size="11.5" fill="#5a7480">the Orchestrator, sequential sub-plans</text>

        <!-- orchestrator core -->
        <rect x="398" y="84" width="288" height="34" rx="8" fill="#d3e6ee" stroke="#c2d3db"/>
        <text x="412" y="105" class="svg-label" font-size="12.5" fill="#173a47">Orchestrator: start · resume · carry state</text>

        <!-- sub-plan stack -->
        <g>
          <rect x="398" y="128" width="288" height="40" rx="8" fill="#ffffff" stroke="#c2d3db"/>
          <text x="412" y="145" class="svg-label" font-size="12" fill="#173a47">sub-plan 01 · archaeology / env</text>
          <text x="412" y="160" class="svg-mono" font-size="9.5" fill="#5e7480">subplan/01-… → final-signoff</text>

          <rect x="398" y="176" width="288" height="40" rx="8" fill="#ffffff" stroke="#c2d3db"/>
          <text x="412" y="193" class="svg-label" font-size="12" fill="#173a47">sub-plan 02 · detect API</text>
          <text x="412" y="208" class="svg-mono" font-size="9.5" fill="#5e7480">plan→audit→implement→review</text>

          <rect x="398" y="224" width="288" height="40" rx="8" fill="#ffffff" stroke="#c2d3db"/>
          <text x="412" y="241" class="svg-label" font-size="12" fill="#173a47">sub-plan 03 · features + model</text>
          <text x="412" y="256" class="svg-mono" font-size="9.5" fill="#5e7480">test-first · adversarial cycle</text>

          <rect x="398" y="272" width="288" height="40" rx="8" fill="#ffffff" stroke="#c2d3db"/>
          <text x="412" y="289" class="svg-label" font-size="12" fill="#173a47">sub-plan 04 · benchmark dataset</text>
          <text x="412" y="304" class="svg-mono" font-size="9.5" fill="#5e7480">one at a time, never two at once</text>

          <rect x="398" y="320" width="288" height="34" rx="8" fill="#fbeeee" stroke="#e0c2c2"/>
          <text x="412" y="341" class="svg-label" font-size="12" fill="#7c2d2d">E2E test vs all DoD</text>
        </g>

        <!-- terminal gate -->
        <rect x="398" y="362" width="288" height="32" rx="8" fill="#e4f0e6" stroke="#b6d6bc"/>
        <text x="412" y="382" class="svg-label" font-size="12" fill="#2f5d3a">✋ terminal gate → main</text>

        <!-- flow arrows B -->
        <g stroke="#6b6456" stroke-width="1.5" fill="none">
          <line x1="542" y1="118" x2="542" y2="126" marker-end="url(#ar)"/>
          <line x1="542" y1="168" x2="542" y2="174" marker-end="url(#ar)"/>
          <line x1="542" y1="216" x2="542" y2="222" marker-end="url(#ar)"/>
          <line x1="542" y1="264" x2="542" y2="270" marker-end="url(#ar)"/>
          <line x1="542" y1="312" x2="542" y2="318" marker-end="url(#ar)"/>
          <line x1="542" y1="354" x2="542" y2="360" marker-end="url(#ar)"/>
        </g>
      </svg>