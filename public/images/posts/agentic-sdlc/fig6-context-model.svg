<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Context management: fresh context per sub-plan plus mandatory ingestion of the full append-only state, avoiding the auto-compaction cliff.">
<style>
  .svg-title{font-family:'Inter','Optima','Gill Sans',sans-serif;font-weight:600;}
  .svg-label{font-family:'Inter','Optima','Gill Sans',sans-serif;}
  .svg-mono{font-family:'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,monospace;}
</style>

        <defs>
          <marker id="arx" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
            <path d="M0,0 L8,4.5 L0,9 Z" fill="#7c2d2d"/>
          </marker>
        </defs>

        <!-- the bad path -->
        <text x="20" y="30" class="svg-label" font-size="11" fill="#9a6b6b" font-weight="600">✗ THE CLIFF (avoided)</text>
        <rect x="20" y="40" width="300" height="40" rx="9" fill="#faf2f2" stroke="#d8b8b8"/>
        <text x="34" y="58" class="svg-label" font-size="11" fill="#7c2d2d">one long context fills to 100%</text>
        <text x="34" y="72" class="svg-label" font-size="9.5" fill="#9a6b6b">→ auto-compaction drops the load-bearing detail</text>

        <!-- the good path -->
        <text x="20" y="118" class="svg-label" font-size="11" fill="#2f5d3a" font-weight="600">✓ THE MODEL</text>

        <!-- durable state store -->
        <g class="svg-label">
          <rect x="20" y="130" width="180" height="106" rx="10" fill="#e8f1f5"/>
          <text x="110" y="152" text-anchor="middle" font-size="11.5" fill="#1f6f8b" font-weight="600">durable, append-only</text>
          <text x="36" y="174" class="svg-mono" font-size="10" fill="#173a47">SPEC.md</text>
          <text x="36" y="192" class="svg-mono" font-size="10" fill="#173a47">WORKLOG.md</text>
          <text x="36" y="210" class="svg-mono" font-size="10" fill="#173a47">git history</text>
          <text x="36" y="227" class="svg-mono" font-size="9" fill="#5e7480">structured · compact · cheap to read</text>
        </g>

        <!-- fresh contexts -->
        <g class="svg-label">
          <rect x="300" y="118" width="180" height="52" rx="10" fill="#fff" stroke="#cfcabb"/>
          <text x="390" y="138" text-anchor="middle" font-size="11.5" fill="#1a1a1a" font-weight="600">sub-plan N · fresh ↻</text>
          <text x="390" y="156" text-anchor="middle" font-size="9.5" fill="#6b6b6b">curated brief + full-state read</text>

          <rect x="300" y="184" width="180" height="52" rx="10" fill="#fff" stroke="#cfcabb"/>
          <text x="390" y="204" text-anchor="middle" font-size="11.5" fill="#1a1a1a" font-weight="600">sub-plan N+1 · fresh ↻</text>
          <text x="390" y="222" text-anchor="middle" font-size="9.5" fill="#6b6b6b">curated brief + full-state read</text>
        </g>

        <!-- read arrows -->
        <path d="M200,168 C250,168 255,144 298,144" stroke="#7c2d2d" stroke-width="1.5" fill="none" marker-end="url(#arx)"/>
        <path d="M200,200 C250,200 255,210 298,210" stroke="#7c2d2d" stroke-width="1.5" fill="none" marker-end="url(#arx)"/>
        <text x="244" y="134" class="svg-label" font-size="9" fill="#9a9484">ingest at start</text>

        <!-- write-back handoff -->
        <path d="M480,156 C540,156 540,176 600,176" stroke="#8a6d1f" stroke-width="1.5" fill="none" marker-end="url(#arx)"/>
        <g class="svg-label">
          <rect x="600" y="156" width="100" height="40" rx="9" fill="#f0ece1" stroke="#cfcabb"/>
          <text x="650" y="174" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="600">handoff</text>
          <text x="650" y="188" text-anchor="middle" font-size="9" fill="#6b6b6b">summary (audited)</text>
        </g>
        <path d="M650,196 C650,224 470,236 392,238" stroke="#8a6d1f" stroke-width="1.3" fill="none" stroke-dasharray="4 3" opacity="0.6"/>
      </svg>