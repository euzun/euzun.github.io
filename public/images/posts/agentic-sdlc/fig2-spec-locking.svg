<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Point-by-point spec locking: each point is proposed, discussed, locked, and becomes append-only before the next opens.">
<style>
  .svg-title{font-family:'Inter','Optima','Gill Sans',sans-serif;font-weight:600;}
  .svg-label{font-family:'Inter','Optima','Gill Sans',sans-serif;}
  .svg-mono{font-family:'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,monospace;}
</style>

        <defs>
          <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
            <path d="M0,0 L8,4.5 L0,9 Z" fill="#8a6d1f"/>
          </marker>
        </defs>
        <!-- locked chain -->
        <g class="svg-label" font-size="12">
          <!-- locked points -->
          <rect x="20" y="40" width="120" height="58" rx="9" fill="#f0ece1" stroke="#cfcabb"/>
          <text x="34" y="62" fill="#2f5d3a" font-size="13">🔒 Point 1</text>
          <text x="34" y="80" font-size="10.5" fill="#6b6b6b">identity</text>
          <text x="34" y="92" font-size="9" fill="#9a9484" font-style="italic">locked · append-only</text>

          <rect x="156" y="40" width="120" height="58" rx="9" fill="#f0ece1" stroke="#cfcabb"/>
          <text x="170" y="62" fill="#2f5d3a" font-size="13">🔒 Point 2</text>
          <text x="170" y="80" font-size="10.5" fill="#6b6b6b">contributions</text>
          <text x="170" y="92" font-size="9" fill="#9a9484" font-style="italic">locked · append-only</text>

          <!-- active point -->
          <rect x="292" y="33" width="132" height="72" rx="9" fill="#fff" stroke="#8a6d1f" stroke-width="2"/>
          <text x="308" y="56" fill="#8a6d1f" font-size="13" font-weight="600">▸ Point 3</text>
          <text x="308" y="74" font-size="10.5" fill="#3d3d3d">scope / out-of-scope</text>
          <text x="308" y="90" font-size="9.5" fill="#8a6d1f" font-style="italic">ACTIVE, discussing</text>

          <!-- future points (ghost) -->
          <rect x="440" y="44" width="116" height="50" rx="9" fill="#faf8f3" stroke="#e4e0d6" stroke-dasharray="3 3"/>
          <text x="454" y="66" fill="#b6b0a0" font-size="13">Point 4</text>
          <text x="454" y="82" font-size="10" fill="#c2bcac">API surface</text>

          <rect x="572" y="44" width="124" height="50" rx="9" fill="#faf8f3" stroke="#e4e0d6" stroke-dasharray="3 3"/>
          <text x="586" y="66" fill="#b6b0a0" font-size="13">Point 5…11</text>
          <text x="586" y="82" font-size="10" fill="#c2bcac">method, schema…</text>
        </g>
        <!-- arrows -->
        <g stroke="#8a6d1f" stroke-width="1.6" fill="none">
          <line x1="140" y1="69" x2="154" y2="69" marker-end="url(#ar2)"/>
          <line x1="276" y1="69" x2="290" y2="69" marker-end="url(#ar2)"/>
          <line x1="424" y1="69" x2="438" y2="69" marker-end="url(#ar2)" opacity="0.4"/>
          <line x1="556" y1="69" x2="570" y2="69" marker-end="url(#ar2)" opacity="0.4"/>
        </g>

        <!-- the cycle under the active point -->
        <g class="svg-label" font-size="11" fill="#3d3d3d">
          <rect x="232" y="150" width="256" height="74" rx="10" fill="#f7f4ec" stroke="#e4e0d6"/>
          <text x="360" y="142" text-anchor="middle" font-size="10.5" fill="#8a6d1f" letter-spacing="1">THE LOOP AT EACH POINT</text>
          <text x="250" y="174">propose</text>
          <text x="318" y="174" fill="#8a6d1f">→ discuss / amend</text>
          <text x="250" y="198" fill="#2f5d3a">→ human says “lock”</text>
          <text x="250" y="216" font-size="9.5" fill="#9a9484" font-style="italic">no auto-advance from silence · reopen = gated</text>
        </g>
        <line x1="358" y1="105" x2="358" y2="148" stroke="#8a6d1f" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#ar2)"/>
      </svg>