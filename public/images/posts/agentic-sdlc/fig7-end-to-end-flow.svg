<svg viewBox="0 0 720 1180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="End-to-end flow of the agentic build pipeline, from intake interview through planning gates to sequential sub-plan execution and the terminal human gate to main.">
<style>
  .svg-title{font-family:'Inter','Optima','Gill Sans',sans-serif;font-weight:600;}
  .svg-label{font-family:'Inter','Optima','Gill Sans',sans-serif;}
  .svg-mono{font-family:'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,monospace;}
</style>

  <defs>
    <marker id="e2e-ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#7c2d2d"/></marker>
    <marker id="e2e-arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#8a6d1f"/></marker>
    <marker id="e2e-ard" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="#6b6456"/></marker>
  </defs>

  <!-- ===================== PLANNING FRONT-END BAND ===================== -->
  <rect x="10" y="14" width="700" height="556" rx="16" fill="#f7f4ec" stroke="#e4e0d6"/>
  <text x="34" y="44" class="svg-title" font-family="'Optima','Gill Sans',sans-serif" font-weight="600" font-size="15" fill="#7c2d2d" letter-spacing="1.5">PLANNING FRONT-END</text>
  <text x="34" y="62" font-family="'Optima','Gill Sans',sans-serif" font-size="11.5" fill="#6b6b6b">cheap · conversational · dense with human gates</text>

  <!-- legend -->
  <g font-family="'Optima','Gill Sans',sans-serif" font-size="10.5">
    <text x="470" y="44" fill="#8a6d1f">⚖ decision</text>
    <text x="556" y="44" fill="#8a6d1f">🔒 lock</text>
    <text x="616" y="44" fill="#7c2d2d">✋ human gate</text>
  </g>

  <!-- node helper geometry: centered column at x=130..590 -->
  <!-- 1 intake -->
  <rect x="60" y="80" width="600" height="40" rx="9" fill="#fff" stroke="#cfcabb"/>
  <text x="78" y="98" font-family="'Optima','Gill Sans',sans-serif" font-size="13" fill="#1a1a1a" font-weight="600">1 · Intake interview</text>
  <text x="78" y="113" font-family="'Optima','Gill Sans',sans-serif" font-size="10.5" fill="#6b6b6b">project · stack · reference (registered read-only) · ambition · instrumentation flag</text>

  <!-- 2 env -->
  <rect x="60" y="132" width="600" height="36" rx="9" fill="#fff" stroke="#cfcabb"/>
  <text x="78" y="149" font-family="'Optima','Gill Sans',sans-serif" font-size="13" fill="#1a1a1a" font-weight="600">2 · Verify toolchain + probe backends</text>
  <text x="78" y="163" font-family="'Optima','Gill Sans',sans-serif" font-size="10.5" fill="#6b6b6b">git / runtime checked regardless · Beads or markdown · worklog backend</text>

  <!-- 3 archaeology -->
  <rect x="60" y="180" width="600" height="40" rx="9" fill="#fff" stroke="#cfcabb"/>
  <text x="78" y="198" font-family="'Optima','Gill Sans',sans-serif" font-size="13" fill="#1a1a1a" font-weight="600">3 · Archaeology pass <tspan font-size="10.5" fill="#9a9484" font-weight="400">(if a reference exists)</tspan></text>
  <text x="78" y="213" font-family="'Optima','Gill Sans',sans-serif" font-size="10.5" fill="#6b6b6b">read reference → extract real logic → seed spec + record pointer map · read-only</text>

  <!-- 4 draft spec + manifest -->
  <rect x="60" y="232" width="600" height="36" rx="9" fill="#fff" stroke="#cfcabb"/>
  <text x="78" y="249" font-family="'Optima','Gill Sans',sans-serif" font-size="13" fill="#1a1a1a" font-weight="600">4 · Draft SPEC.md + permission manifest</text>
  <text x="78" y="263" font-family="'Optima','Gill Sans',sans-serif" font-size="10.5" fill="#6b6b6b">first draft, incorporating archaeology findings</text>

  <!-- 5 viability -->
  <rect x="60" y="280" width="600" height="44" rx="9" fill="#fff" stroke="#cfcabb"/>
  <text x="78" y="299" font-family="'Optima','Gill Sans',sans-serif" font-size="13" fill="#1a1a1a" font-weight="600">5 · Viability agent → tiered advisory</text>
  <text x="78" y="314" font-family="'Optima','Gill Sans',sans-serif" font-size="10.5" fill="#6b6b6b">literature · impact · cost → scope tiers (quality always tier-1)</text>
  <text x="628" y="305" font-size="15" fill="#8a6d1f">⚖</text>

  <!-- 5b methodology (conditional) -->
  <rect x="84" y="334" width="576" height="34" rx="9" fill="#f0ece1" stroke="#d8d2c2" stroke-dasharray="4 3"/>
  <text x="100" y="351" font-family="'Optima','Gill Sans',sans-serif" font-size="11.5" fill="#6b6b6b" font-weight="600">if INSTRUMENTATION=on →</text>
  <text x="252" y="351" font-family="'Optima','Gill Sans',sans-serif" font-size="11" fill="#6b6b6b">Methodology sub-agent writes pre-registered EVALUATION.md</text>

  <!-- GATE A -->
  <rect x="60" y="380" width="600" height="38" rx="9" fill="#fbecec" stroke="#d8b8b8"/>
  <text x="78" y="398" font-family="'Optima','Gill Sans',sans-serif" font-size="12.5" fill="#7c2d2d" font-weight="600">✋ HUMAN GATE: review spec + advisory</text>
  <text x="78" y="412" font-family="'Optima','Gill Sans',sans-serif" font-size="10.5" fill="#9a6b6b">choose a scope tier · or kill · or pivot</text>

  <!-- 6 point-by-point lock -->
  <rect x="60" y="430" width="600" height="38" rx="9" fill="#fff" stroke="#cfcabb"/>
  <text x="78" y="448" font-family="'Optima','Gill Sans',sans-serif" font-size="13" fill="#1a1a1a" font-weight="600">6 · Build SPEC.md point-by-point → fully locked</text>
  <text x="78" y="462" font-family="'Optima','Gill Sans',sans-serif" font-size="10.5" fill="#6b6b6b">append-only locking · explicit per-point confirm · no auto-advance</text>
  <text x="628" y="453" font-size="14" fill="#8a6d1f">🔒</text>

  <!-- 7 manifest approve + decomposition -->
  <rect x="60" y="478" width="600" height="36" rx="9" fill="#fff" stroke="#cfcabb"/>
  <text x="78" y="495" font-family="'Optima','Gill Sans',sans-serif" font-size="13" fill="#1a1a1a" font-weight="600">7 · Approve manifest + propose sub-plan map</text>
  <text x="78" y="509" font-family="'Optima','Gill Sans',sans-serif" font-size="10.5" fill="#6b6b6b">mandatory + spec-derived sub-plans · scope / DoD / explicit non-scope</text>

  <!-- GATE B -->
  <rect x="60" y="524" width="600" height="34" rx="9" fill="#fbecec" stroke="#d8b8b8"/>
  <text x="78" y="545" font-family="'Optima','Gill Sans',sans-serif" font-size="12.5" fill="#7c2d2d" font-weight="600">✋ HUMAN GATE: “what’s missing?” · add any as a first-class sub-plan</text>

  <!-- front-end vertical connectors -->
  <g stroke="#c9a23a" stroke-width="1.5" fill="none" opacity="0.9">
    <line x1="360" y1="120" x2="360" y2="130" marker-end="url(#e2e-arg)"/>
    <line x1="360" y1="168" x2="360" y2="178" marker-end="url(#e2e-arg)"/>
    <line x1="360" y1="220" x2="360" y2="230" marker-end="url(#e2e-arg)"/>
    <line x1="360" y1="268" x2="360" y2="278" marker-end="url(#e2e-arg)"/>
    <line x1="360" y1="368" x2="360" y2="378" marker-end="url(#e2e-arg)"/>
    <line x1="360" y1="418" x2="360" y2="428" marker-end="url(#e2e-arg)"/>
    <line x1="360" y1="468" x2="360" y2="476" marker-end="url(#e2e-arg)"/>
    <line x1="360" y1="514" x2="360" y2="522" marker-end="url(#e2e-arg)"/>
  </g>

  <!-- hand-off arrow between bands -->
  <line x1="360" y1="570" x2="360" y2="600" stroke="#7c2d2d" stroke-width="2.4" marker-end="url(#e2e-ar)"/>
  <text x="372" y="589" font-family="'Optima','Gill Sans',sans-serif" font-size="11" fill="#7c2d2d">hand-off → orchestrator</text>

  <!-- ===================== EXECUTION ENGINE BAND ===================== -->
  <rect x="10" y="606" width="700" height="540" rx="16" fill="#e8f1f5" stroke="#bcd6e1"/>
  <text x="34" y="636" class="svg-title" font-family="'Optima','Gill Sans',sans-serif" font-weight="600" font-size="15" fill="#1f6f8b" letter-spacing="1.5">EXECUTION ENGINE</text>
  <text x="34" y="654" font-family="'Optima','Gill Sans',sans-serif" font-size="11.5" fill="#5a7480">sequential sub-plans · resumable · everything logged</text>

  <!-- 8 provisioning -->
  <rect x="60" y="672" width="600" height="42" rx="9" fill="#ffffff" stroke="#c2d3db"/>
  <text x="78" y="690" font-family="'Optima','Gill Sans',sans-serif" font-size="13" fill="#173a47" font-weight="600">8 · Provision agents → smoke-test each once</text>
  <text x="78" y="705" font-family="'Optima','Gill Sans',sans-serif" font-size="10.5" fill="#5e7480">base roles (stack) + domain SMEs (crypto / security / perf …) · hard-stop if any fails</text>

  <!-- 9 execute header -->
  <rect x="60" y="726" width="600" height="40" rx="9" fill="#d3e6ee" stroke="#c2d3db"/>
  <text x="78" y="744" font-family="'Optima','Gill Sans',sans-serif" font-size="13" fill="#173a47" font-weight="600">9 · Execute sub-plans, strictly one at a time</text>
  <text x="78" y="759" font-family="'Optima','Gill Sans',sans-serif" font-size="10.5" fill="#5e7480">↻ each starts fresh + ingests full state (spec · worklog · git) · parallel sub-tasks OK within one</text>

  <!-- per-sub-plan inset: full vs light cycle -->
  <rect x="60" y="776" width="600" height="120" rx="11" fill="#dcebf2" stroke="#c2d3db"/>
  <text x="78" y="797" font-family="'Optima','Gill Sans',sans-serif" font-size="11" fill="#1f6f8b" letter-spacing="1">THE PER-SUB-PLAN CYCLE</text>

  <!-- full cycle row -->
  <text x="78" y="820" font-family="'Optima','Gill Sans',sans-serif" font-size="10.5" fill="#9a9484">full (method-bearing):</text>
  <g font-family="'Optima','Gill Sans',sans-serif" font-size="11" fill="#173a47">
    <rect x="208" y="808" width="58" height="22" rx="6" fill="#ffffff" stroke="#c2d3db"/><text x="237" y="823" text-anchor="middle">plan</text>
    <rect x="274" y="808" width="62" height="22" rx="6" fill="#ffffff" stroke="#c2d3db"/><text x="305" y="823" text-anchor="middle" fill="#1f6f8b">audit</text>
    <rect x="344" y="808" width="86" height="22" rx="6" fill="#ffffff" stroke="#c2d3db"/><text x="387" y="823" text-anchor="middle">agree ≤2</text>
    <rect x="438" y="808" width="84" height="22" rx="6" fill="#ffffff" stroke="#c2d3db"/><text x="480" y="823" text-anchor="middle">implement</text>
    <rect x="530" y="808" width="66" height="22" rx="6" fill="#ffffff" stroke="#c2d3db"/><text x="563" y="823" text-anchor="middle" fill="#1f6f8b">review</text>
    <rect x="604" y="808" width="50" height="22" rx="6" fill="#ffffff" stroke="#c2d3db"/><text x="629" y="823" text-anchor="middle">agree</text>
  </g>
  <!-- arrows along full row -->
  <g stroke="#6b6456" stroke-width="1.2" fill="none">
    <line x1="266" y1="819" x2="273" y2="819" marker-end="url(#e2e-ard)"/>
    <line x1="336" y1="819" x2="343" y2="819" marker-end="url(#e2e-ard)"/>
    <line x1="430" y1="819" x2="437" y2="819" marker-end="url(#e2e-ard)"/>
    <line x1="522" y1="819" x2="529" y2="819" marker-end="url(#e2e-ard)"/>
    <line x1="596" y1="819" x2="603" y2="819" marker-end="url(#e2e-ard)"/>
  </g>
  <text x="78" y="852" font-family="'Optima','Gill Sans',sans-serif" font-size="10" fill="#5e7480">+ independent SME sign-off if domain-touching · test-first (red→green) · right-size model/effort</text>

  <!-- light cycle row -->
  <text x="78" y="876" font-family="'Optima','Gill Sans',sans-serif" font-size="10.5" fill="#9a9484">light (plumbing):</text>
  <g font-family="'Optima','Gill Sans',sans-serif" font-size="11" fill="#173a47">
    <rect x="208" y="864" width="58" height="22" rx="6" fill="#ffffff" stroke="#c2d3db"/><text x="237" y="879" text-anchor="middle">plan</text>
    <rect x="274" y="864" width="84" height="22" rx="6" fill="#ffffff" stroke="#c2d3db"/><text x="316" y="879" text-anchor="middle">implement</text>
    <rect x="366" y="864" width="66" height="22" rx="6" fill="#ffffff" stroke="#c2d3db"/><text x="399" y="879" text-anchor="middle" fill="#1f6f8b">review</text>
  </g>
  <g stroke="#6b6456" stroke-width="1.2" fill="none">
    <line x1="266" y1="875" x2="273" y2="875" marker-end="url(#e2e-ard)"/>
    <line x1="358" y1="875" x2="365" y2="875" marker-end="url(#e2e-ard)"/>
  </g>
  <text x="448" y="879" font-family="'Optima','Gill Sans',sans-serif" font-size="9.5" fill="#5e7480" font-style="italic">on non-convergence →</text>
  <text x="448" y="891" font-family="'Optima','Gill Sans',sans-serif" font-size="9.5" fill="#9a6b6b" font-style="italic">escalate with both positions</text>

  <!-- merge per sub-plan -->
  <rect x="60" y="908" width="600" height="34" rx="9" fill="#ffffff" stroke="#c2d3db"/>
  <text x="78" y="929" font-family="'SFMono-Regular',ui-monospace,Menlo,monospace" font-size="10.5" fill="#173a47">branch subplan/NN-name · logical commits · --no-ff ► final-signoff</text>
  <text x="470" y="929" font-family="'Optima','Gill Sans',sans-serif" font-size="9.5" fill="#5e7480" font-style="italic">↺ repeat for next sub-plan</text>

  <!-- telemetry conditional -->
  <rect x="84" y="950" width="576" height="30" rx="8" fill="#dcebf2" stroke="#c2d3db" stroke-dasharray="4 3"/>
  <text x="100" y="969" font-family="'Optima','Gill Sans',sans-serif" font-size="10.5" fill="#5e7480">if INSTRUMENTATION=on → append-only telemetry per step (no observer effect) → metrics/run.jsonl</text>

  <!-- E2E test -->
  <rect x="60" y="990" width="600" height="34" rx="9" fill="#fbeeee" stroke="#e0c2c2"/>
  <text x="78" y="1011" font-family="'Optima','Gill Sans',sans-serif" font-size="12.5" fill="#7c2d2d" font-weight="600">10 · Orchestrator end-to-end test vs ALL definitions-of-done</text>

  <!-- TERMINAL GATE -->
  <rect x="60" y="1032" width="600" height="38" rx="9" fill="#e4f0e6" stroke="#b6d6bc"/>
  <text x="78" y="1051" font-family="'Optima','Gill Sans',sans-serif" font-size="12.5" fill="#2f5d3a" font-weight="600">✋ TERMINAL HUMAN GATE: promote final-signoff ► main</text>
  <text x="78" y="1064" font-family="'Optima','Gill Sans',sans-serif" font-size="10" fill="#3f7a4f">main stays protected · only fully signed-off work lands</text>

  <!-- execution vertical connectors -->
  <g stroke="#6b6456" stroke-width="1.4" fill="none">
    <line x1="360" y1="714" x2="360" y2="724" marker-end="url(#e2e-ar)"/>
    <line x1="360" y1="766" x2="360" y2="774" marker-end="url(#e2e-ar)"/>
    <line x1="360" y1="942" x2="360" y2="948" marker-end="url(#e2e-ar)"/>
    <line x1="360" y1="980" x2="360" y2="988" marker-end="url(#e2e-ar)"/>
    <line x1="360" y1="1024" x2="360" y2="1030" marker-end="url(#e2e-ar)"/>
  </g>

  <!-- ===================== THROUGHOUT FOOTER ===================== -->
  <rect x="10" y="1086" width="700" height="80" rx="14" fill="#f3f1ea" stroke="#e4e0d6"/>
  <text x="34" y="1110" font-family="'Optima','Gill Sans',sans-serif" font-weight="600" font-size="12" fill="#6b6b6b" letter-spacing="1.2">RUNNING THROUGHOUT</text>
  <g font-family="'Optima','Gill Sans',sans-serif" font-size="11" fill="#3d3d3d">
    <text x="34" y="1132">• tier-set budget + circuit-breaker</text>
    <text x="270" y="1132">• manifest = sole permission authority</text>
    <text x="514" y="1132">• append-only worklog</text>
    <text x="34" y="1152">• read-only reference, outside the tree</text>
    <text x="270" y="1152">• “not enumerated” = stop &amp; ask</text>
    <text x="514" y="1152">• never hit the context limit</text>
  </g>
</svg>
